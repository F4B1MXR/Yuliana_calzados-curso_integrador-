<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestionar variación | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('variaciones')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Variaciones', 'Registrar o editar una variación')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/variaciones}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a variaciones
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">INVENTARIO</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${variacion.idVariacion == null} ? 'Registrar variación' : 'Editar variación'">
                        Registrar variación
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa los datos del modelo, la talla, el color y las unidades disponibles.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-tags"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información de la variación</h2>
                                <p class="text-secondary small mb-0">Todos los campos son obligatorios.</p>
                            </div>
                        </div>

                        <form th:action="@{/variaciones/guardar}"
                              th:object="${variacion}"
                              method="post">

                            <input type="hidden" th:field="*{idVariacion}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="idProducto" class="form-label fw-semibold">
                                        Producto <span class="text-danger">*</span>
                                    </label>
                                    <select id="idProducto"
                                            name="idProducto"
                                            class="form-select"
                                            required>
                                        <option value="">Selecciona un modelo</option>
                                        <option th:each="producto : ${productos}"
                                                th:value="${producto.idProducto}"
                                                th:text="${producto.modeloProd}"
                                                th:selected="${variacion.producto != null
                                                and variacion.producto.idProducto == producto.idProducto}">
                                        </option>
                                    </select>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('producto')}"
                                         th:errors="*{producto}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="talla" class="form-label fw-semibold">
                                        Talla <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           id="talla"
                                           th:field="*{talla}"
                                           class="form-control"
                                           placeholder="Ej. 37"
                                           maxlength="10"
                                           required>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('talla')}"
                                         th:errors="*{talla}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="colorPv" class="form-label fw-semibold">
                                        Color <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           id="colorPv"
                                           th:field="*{colorPv}"
                                           class="form-control"
                                           placeholder="Ej. Negro, beige o marrón"
                                           maxlength="50"
                                           required>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('colorPv')}"
                                         th:errors="*{colorPv}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="stock" class="form-label fw-semibold">
                                        Stock disponible <span class="text-danger">*</span>
                                    </label>
                                    <input type="number"
                                           id="stock"
                                           th:field="*{stock}"
                                           class="form-control"
                                           min="0"
                                           required>
                                    <div class="form-text">Ingresa la cantidad de unidades disponibles.</div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('stock')}"
                                         th:errors="*{stock}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/variaciones}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar variación
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
