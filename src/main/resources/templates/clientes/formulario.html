<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de cliente | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('clientes')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Clientes', 'Registra o edita la información de un cliente')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/clientes}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a clientes
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">CLIENTES</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${cliente.idCliente == null} ? 'Nuevo cliente' : 'Editar cliente'">
                        Nuevo cliente
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa los datos de la cuenta y el perfil del cliente.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-person-vcard"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información del cliente</h2>
                                <p class="text-secondary small mb-0">Completa los datos del perfil.</p>
                            </div>
                        </div>

                        <form th:action="@{/clientes/guardar}"
                              th:object="${cliente}"
                              method="post">

                            <input type="hidden" th:field="*{idCliente}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="usuario" class="form-label fw-semibold">
                                        Cuenta de usuario <span class="text-danger">*</span>
                                    </label>
                                    <select id="usuario"
                                            th:field="*{usuario.idUsuario}"
                                            class="form-select"
                                            required
                                            th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid' : ''">
                                        <option value="">Selecciona una cuenta</option>
                                        <option th:each="u : ${usuariosDisponibles}"
                                                th:value="${u.idUsuario}"
                                                th:text="${u.correoUsu}">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('usuario')}"
                                         th:errors="*{usuario}">
                                    </div>
                                    <div th:if="${#lists.isEmpty(usuariosDisponibles)}"
                                         class="form-text text-danger">
                                        No hay cuentas de usuario disponibles para asignar.
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="nombreCli" class="form-label fw-semibold">
                                        Nombre <span class="text-danger">*</span>
                                    </label>
                                    <input id="nombreCli"
                                           type="text"
                                           th:field="*{nombreCli}"
                                           class="form-control"
                                           maxlength="100"
                                           required
                                           th:classappend="${#fields.hasErrors('nombreCli')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('nombreCli')}"
                                         th:errors="*{nombreCli}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="apellidoCli" class="form-label fw-semibold">Apellido</label>
                                    <input id="apellidoCli"
                                           type="text"
                                           th:field="*{apellidoCli}"
                                           class="form-control"
                                           maxlength="100"
                                           th:classappend="${#fields.hasErrors('apellidoCli')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('apellidoCli')}"
                                         th:errors="*{apellidoCli}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="telefonoCli" class="form-label fw-semibold">Teléfono</label>
                                    <input id="telefonoCli"
                                           type="tel"
                                           th:field="*{telefonoCli}"
                                           class="form-control"
                                           maxlength="9"
                                           pattern="[0-9]{9}"
                                           placeholder="987654321"
                                           th:classappend="${#fields.hasErrors('telefonoCli')} ? 'is-invalid' : ''">
                                    <div class="form-text">Ingresa un número de 9 dígitos.</div>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('telefonoCli')}"
                                         th:errors="*{telefonoCli}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/clientes}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar cliente
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
