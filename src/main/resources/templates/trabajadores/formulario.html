<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de trabajador | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('trabajadores')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Trabajadores', 'Registra o edita los datos del personal')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/trabajadores}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a trabajadores
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">PERSONAL</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${trabajador.idTrabajador == null} ? 'Nuevo trabajador' : 'Editar trabajador'">
                        Nuevo trabajador
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa la información de la cuenta y del cargo del trabajador.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-person-badge"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información del trabajador</h2>
                                <p class="text-secondary small mb-0">Completa los datos del perfil laboral.</p>
                            </div>
                        </div>

                        <form th:action="@{/trabajadores/guardar}"
                              th:object="${trabajador}"
                              method="post">

                            <input type="hidden" th:field="*{idTrabajador}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="usuario" class="form-label fw-semibold">
                                        Cuenta de usuario <span class="text-danger">*</span>
                                    </label>
                                    <select id="usuario"
                                            class="form-select"
                                            th:field="*{usuario.idUsuario}"
                                            required
                                            th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid' : ''">
                                        <option value="">Selecciona una cuenta</option>
                                        <option th:each="u : ${usuariosDisponibles}"
                                                th:value="${u.idUsuario}"
                                                th:text="${u.correoUsu}">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('usuario')}"
                                         th:errors="*{usuario}">
                                    </div>
                                    <div th:if="${#lists.isEmpty(usuariosDisponibles)}"
                                         class="form-text text-danger">
                                        No hay cuentas de usuario disponibles para asignar.
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="nombreTra" class="form-label fw-semibold">
                                        Nombre <span class="text-danger">*</span>
                                    </label>
                                    <input id="nombreTra"
                                           type="text"
                                           class="form-control"
                                           th:field="*{nombreTra}"
                                           maxlength="100"
                                           required
                                           th:classappend="${#fields.hasErrors('nombreTra')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('nombreTra')}"
                                         th:errors="*{nombreTra}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="apellidoTra" class="form-label fw-semibold">Apellido</label>
                                    <input id="apellidoTra"
                                           type="text"
                                           class="form-control"
                                           th:field="*{apellidoTra}"
                                           maxlength="100"
                                           th:classappend="${#fields.hasErrors('apellidoTra')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('apellidoTra')}"
                                         th:errors="*{apellidoTra}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="telefonoTra" class="form-label fw-semibold">Teléfono</label>
                                    <input id="telefonoTra"
                                           type="tel"
                                           class="form-control"
                                           th:field="*{telefonoTra}"
                                           maxlength="9"
                                           pattern="[0-9]{9}"
                                           placeholder=""
                                           th:classappend="${#fields.hasErrors('telefonoTra')} ? 'is-invalid' : ''">
                                    <div class="form-text">Ingresa un número de 9 dígitos.</div>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('telefonoTra')}"
                                         th:errors="*{telefonoTra}">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="cargoTra" class="form-label fw-semibold">
                                        Cargo <span class="text-danger">*</span>
                                    </label>
                                    <select id="cargoTra"
                                            class="form-select"
                                            th:field="*{cargoTra}"
                                            required
                                            th:classappend="${#fields.hasErrors('cargoTra')} ? 'is-invalid' : ''">
                                        <option value="">Selecciona un cargo</option>
                                        <option value="Administrador">Administrador</option>
                                        <option value="Vendedor">Vendedor</option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('cargoTra')}"
                                         th:errors="*{cargoTra}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/trabajadores}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar trabajador
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
