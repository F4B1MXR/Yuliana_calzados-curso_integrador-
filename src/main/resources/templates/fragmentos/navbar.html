<nav th:fragment="nbar" class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm"
  th:data-id-usuario="${session.usuarioSesion != null ? session.usuarioSesion.idUsuario : ''}">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/index}">
      <img th:src="@{/img/logo.jpeg}" alt="Nombre">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" th:href="@{/index}">INICIO</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/#ofertas}"> OFERTAS </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/coleccion}">COLECCIÓN</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/contacto}">CONTACTO</a>
        </li>
      </ul>

      <div class="dropdown ms-2" th:if="${session.usuarioSesion != null}">

        <button class="btn btn-link btn-cuenta text-white text-decoration-none dropdown-toggle" type="button"
          data-bs-toggle="dropdown" aria-expanded="false">

          <i class="bi bi-person-circle text-white"></i>
          <span th:text="${session.usuarioSesion.nombre}">Mi cuenta</span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item" th:href="${session.usuarioSesion.rol == 'Administrador'}
                        ? @{/admin}
                        : (${session.usuarioSesion.rol == 'Vendedor'}
                            ? @{/ventas-fisicas}
                            : @{/index})">
              <span th:text="${session.usuarioSesion.rol}">Cliente</span>
            </a>
          </li>

          <li>
            <hr class="dropdown-divider">
          </li>

          <li>
            <a class="dropdown-item" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right me-2"></i>
              Cerrar sesión
            </a>
          </li>
        </ul>
      </div>

      <!-- Si el usuario NO inició sesión -->
      <a th:if="${session.usuarioSesion == null}" th:href="@{/login(logout)}" class="ms-2">
        <i class="bi bi-person text-dark" role="button" style="cursor: pointer;"></i>
      </a>

      <!-- icono del carrito -->

      <i class="bi bi-cart2 text-dark" role="button" style="cursor: pointer;" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasCarrito" aria-controls="offcanvasCarrito"></i>

    </div>
  </div>
</nav>
