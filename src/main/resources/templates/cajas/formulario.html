<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de caja | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/vend-sidebar :: sidebar('cajas')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/vend-topbar :: topbar('Gestión de cajas', 'Registra o edita los datos de la caja del vendedor')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/cajas}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a cajas
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">VENTAS</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${caja.idCaja == null} ? 'Registrar caja' : 'Editar caja'">
                        Registrar caja
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa los datos de apertura de la caja del vendedor.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-cash-stack"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información de la caja</h2>
                                <p class="text-secondary small mb-0">Selecciona al vendedor e indica el monto inicial.</p>
                            </div>
                        </div>

                        <form th:action="@{/cajas/guardar}" th:object="${caja}" method="post">

                            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                                <p class="mb-1">No se pudo guardar la caja:</p>
                                <ul class="mb-0">
                                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                                </ul>
                            </div>

                            <input type="hidden" th:field="*{idCaja}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="vendedor" class="form-label fw-semibold">
                                        Vendedor <span class="text-danger">*</span>
                                    </label>
                                    <select id="vendedor"
                                            name="vendedorId"
                                            class="form-select"
                                            required
                                            th:classappend="${#fields.hasErrors('vendedor')} ? 'is-invalid' : ''">
                                        <option value="">Selecciona un vendedor</option>
                                        <option th:each="trabajador : ${trabajadores}"
                                                th:value="${trabajador.idTrabajador}"
                                                th:text="${trabajador.nombreTra + ' ' + trabajador.apellidoTra}"
                                                th:selected="${caja.vendedor != null
                                                and caja.vendedor.idTrabajador == trabajador.idTrabajador}">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('vendedor')}"
                                         th:errors="*{vendedor}">
                                    </div>
                                    <div th:if="${#lists.isEmpty(trabajadores)}" class="form-text text-danger">
                                        No hay trabajadores disponibles para asignar a esta caja.
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="montoInicialCaja" class="form-label fw-semibold">
                                        Monto inicial (S/) <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">S/</span>
                                        <input type="number"
                                               id="montoInicialCaja"
                                               th:field="*{montoInicialCaja}"
                                               class="form-control"
                                               min="0"
                                               step="0.01"
                                               required
                                               th:classappend="${#fields.hasErrors('montoInicialCaja')} ? 'is-invalid' : ''">
                                    </div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('montoInicialCaja')}"
                                         th:errors="*{montoInicialCaja}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/cajas}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar caja
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
