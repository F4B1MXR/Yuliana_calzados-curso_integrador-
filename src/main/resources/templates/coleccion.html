<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <nav th:replace="~{fragmentos/navbar :: nbar}"></nav>

    <div th:replace="~{fragmentos/modal-login :: modal-login}"></div>
    <div th:replace="~{fragmentos/offcanvas-carrito :: offcanvas-carrito}"></div>

    <section class="banner-coleccion">
        <img th:src="@{/img/banner-coleccion.png}" alt="Colección de calzado">
        <div class="banner-coleccion-texto">
            <h1>NUEVA COLECCIÓN</h1>
            <p>Encuentra el calzado perfecto para cada ocasión.</p>
        </div>
    </section>

    <section class="categorias py-4">
        <div class="container">
            <div class="d-flex justify-content-center flex-wrap gap-2" id="filtrosCategorias">
                <button type="button" class="btn btn-dark filtro-categoria active" data-categoria="todas">
                    TODAS
                </button>
                <button th:each="categoria : ${categorias}"
                    type="button"
                    class="btn btn-outline-dark filtro-categoria"
                    th:data-categoria="${categoria.idCategoria}"
                    th:text="${categoria.nombreCat}">
                </button>
            </div>
        </div>
    </section>

    <main class="container py-3">
        <h2 class="text-center fw-bold mb-4">Nuestra colección</h2>

        <div th:if="${#lists.isEmpty(productos)}" class="alert text-center" role="status">
            Aún no hay productos activos para mostrar.
        </div>

        <div th:unless="${#lists.isEmpty(productos)}" class="row g-4" id="listaProductos">
            <div th:each="producto : ${productos}"
                class="col-12 col-md-6 col-lg-4 tarjeta-producto"
                th:data-categoria="${producto.categoria.idCategoria}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${producto.imagenProd != null ? producto.imagenProd : '/img/banner-coleccion.png'}"
                        class="card-img-top"
                        style="height: 250px; object-fit: cover;"
                        th:alt="${producto.modeloProd}">
                    <div class="card-body d-flex flex-column">
                        <span class="badge text-bg-light align-self-start mb-2"
                            th:text="${producto.categoria.nombreCat}"></span>
                        <h5 class="card-title" th:text="${producto.modeloProd}"></h5>
                        <p class="card-text text-muted"
                            th:text="${#strings.isEmpty(producto.descripcionProd) ? 'Calzado para cada ocasión.' : producto.descripcionProd}">
                        </p>
                        <p class="fw-bold fs-5 text-dark"
                            th:text="|S/ ${#numbers.formatDecimal(producto.precioProd, 1, 2)}|"></p>
                        <button type="button"
                            class="btn mt-auto text-white btn-detalle"
                            data-bs-toggle="modal"
                            data-bs-target="#modalDetalle"
                            th:data-id="${producto.idProducto}"
                            th:data-producto="${producto.modeloProd}"
                            th:data-descripcion="${producto.descripcionProd}"
                            th:data-categoria="${producto.categoria.nombreCat}"
                            th:data-precio="${producto.precioProd}"
                            th:data-imagen="${producto.imagenProd != null ? producto.imagenProd : '/img/banner-coleccion.png'}">
                            Ver detalles
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="variacionesCatalogo" class="d-none" aria-hidden="true">
        <span th:each="variacion : ${variaciones}"
            th:data-producto-id="${variacion.producto.idProducto}"
            th:data-talla="${variacion.talla}"
            th:data-color="${variacion.colorPv}"
            th:data-stock="${variacion.stock}">
        </span>
    </div>

    <div th:replace="~{fragmentos/modal-detalle :: modal-detalle}"></div>
    <div th:replace="~{fragmentos/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/coleccion.js}"></script>
    <script th:src="@{/js/carrito.js}"></script>
</body>

</html>
