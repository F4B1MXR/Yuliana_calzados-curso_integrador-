<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de categoría | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('categorias')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Categorías', 'Registrar o editar una categoría')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/categorias}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a categorías
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">CATÁLOGO</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${categoria.idCategoria == null} ? 'Nueva categoría' : 'Editar categoría'">
                        Nueva categoría
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa los datos para organizar los productos de tu catálogo.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-tags"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información de la categoría</h2>
                                <p class="text-secondary small mb-0">Completa el nombre y la descripción.</p>
                            </div>
                        </div>

                        <form th:action="@{/categorias/guardar}"
                              th:object="${categoria}"
                              method="post">

                            <input type="hidden" th:field="*{idCategoria}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="nombreCat" class="form-label fw-semibold">
                                        Nombre <span class="text-danger">*</span>
                                    </label>
                                    <input id="nombreCat"
                                           type="text"
                                           th:field="*{nombreCat}"
                                           class="form-control"
                                           placeholder="Ej. Sandalias"
                                           required
                                           th:classappend="${#fields.hasErrors('nombreCat')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('nombreCat')}"
                                         th:errors="*{nombreCat}">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="descripcionCat" class="form-label fw-semibold">
                                        Descripción
                                    </label>
                                    <textarea id="descripcionCat"
                                              th:field="*{descripcionCat}"
                                              class="form-control"
                                              rows="4"
                                              placeholder="Describe los productos que pertenecen a esta categoría"
                                              th:classappend="${#fields.hasErrors('descripcionCat')} ? 'is-invalid' : ''"></textarea>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('descripcionCat')}"
                                         th:errors="*{descripcionCat}">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/categorias}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar categoría
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
